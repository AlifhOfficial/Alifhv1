# Fly.io configuration for WebSocket server
# Deploy: fly deploy --config fly.ws.toml

app = "revvup-ws"
primary_region = "sin"

[build]
  dockerfile = "apps/ws/Dockerfile"

[env]
  WS_PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000   # drop connections above this — protects the machine
    soft_limit = 750    # start routing new connections to a 2nd machine at this point

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
