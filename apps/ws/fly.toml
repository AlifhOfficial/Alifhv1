# Fly.io configuration for WebSocket server
# Deploy from repo root: fly deploy --config apps/ws/fly.toml

app = "revvup-ws"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  WS_PORT = "3001"
  NODE_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  # Keep at least one machine always warm for messaging reliability.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    # Let one machine carry more sockets before scaling a second machine.
    hard_limit = 1400
    soft_limit = 1000

[[vm]]
  # 512MB is usually enough for a Bun WS server with in-memory presence maps.
  # Move back to 1GB only if memory pressure appears in Fly metrics.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
